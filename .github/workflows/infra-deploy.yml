name: Provision Azure infrastructure (Bicep)

on:
  workflow_dispatch:
    inputs:
      parametersFile:
        description: "Parameters file under infra/ to use"
        required: true
        default: "main.parameters.json"
        type: choice
        options:
          - main.parameters.json
          - main.parameters.prod.json

# Deliberately manual-only: this provisions/updates real infrastructure
# (including a database), so it should never fire on a routine push.

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: |
          az group show --name "${{ vars.AZURE_RESOURCE_GROUP }}" >/dev/null 2>&1 || \
          az group create --name "${{ vars.AZURE_RESOURCE_GROUP }}" --location "${{ vars.AZURE_LOCATION }}"

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/${{ inputs.parametersFile }} \
            --parameters postgresAdminPassword="${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
            --parameters jwtSecret="${{ secrets.JWT_SECRET }}"
