name: Deploy backend to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC federated login (azure/login) — no client secret stored in GitHub
  contents: read

concurrency:
  group: deploy-backend-azure
  cancel-in-progress: false # never cancel a deploy mid-flight (could leave the migrate job or an app half-updated)

env:
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_NAME: fastship-api
  # Repo Variables (Settings -> Secrets and variables -> Actions -> Variables) — resource
  # names, not secrets, but still environment-specific so they live outside the workflow file.
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
  API_APP_NAME: ${{ vars.AZURE_API_APP_NAME }}
  WORKER_APP_NAME: ${{ vars.AZURE_WORKER_APP_NAME }}
  BEAT_APP_NAME: ${{ vars.AZURE_BEAT_APP_NAME }}
  MIGRATE_JOB_NAME: ${{ vars.AZURE_MIGRATE_JOB_NAME }}

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR (cloud build, no local Docker daemon needed)
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "${IMAGE_NAME}:${IMAGE_TAG}" \
            --image "${IMAGE_NAME}:latest" \
            ./backend

      - name: Run database migration job
        run: |
          FULL_IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"
          az containerapp job update \
            --name "$MIGRATE_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$FULL_IMAGE"

          EXECUTION_NAME=$(az containerapp job start \
            --name "$MIGRATE_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "name" -o tsv)

          echo "Waiting on migrate job execution: $EXECUTION_NAME"
          for i in $(seq 1 30); do
            STATUS=$(az containerapp job execution show \
              --name "$MIGRATE_JOB_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$EXECUTION_NAME" \
              --query "properties.status" -o tsv)
            echo "  status: $STATUS"
            if [ "$STATUS" = "Succeeded" ]; then
              exit 0
            fi
            if [ "$STATUS" = "Failed" ]; then
              echo "Migration job failed" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for migration job" >&2
          exit 1

      - name: Deploy new image to api / celery-worker / celery-beat
        run: |
          FULL_IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"
          for APP in "$API_APP_NAME" "$WORKER_APP_NAME" "$BEAT_APP_NAME"; do
            echo "Updating $APP -> $FULL_IMAGE"
            az containerapp update \
              --name "$APP" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$FULL_IMAGE"
          done

      - name: Smoke test /health
        run: |
          FQDN=$(az containerapp show \
            --name "$API_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          for i in $(seq 1 12); do
            if curl -sf "https://${FQDN}/health" > /dev/null; then
              echo "Health check passed"
              exit 0
            fi
            echo "Health check attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check did not pass after deploy" >&2
          exit 1
